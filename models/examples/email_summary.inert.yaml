name: email_summary
description: Read an e-mail and send a summary to a colleague.
agents:
  - {id: planner, role: Planner}
  - {id: analyst, role: Analyst}
  - {id: reporter, role: Reporter}
tools:
  - name: read_email
    description: Read the e-mail with the given inbox index.
    args: {index: {type: integer, role: executor, minimum: 0, maximum: 9}}
    side_effect: read
    output_label: external_untrusted
  - name: send_email
    description: Send an e-mail.
    args:
      to: {type: string, role: executor, max_length: 64, pattern: '[\w.+-]+@[\w-]+\.[\w.]+'}
      body: {type: string, role: data}
    side_effect: write
    output_label: user
slots:
  - {id: task, kind: input, label: user}
  - id: intent
    kind: agent
    owner: planner
    instruction: Extract from the user's request the inbox index of the e-mail to read and the recipient address.
    reads: [task]
    fields:
      index: {type: integer, role: executor, minimum: 0, maximum: 9}
      recipient: {type: string, role: executor, max_length: 64, pattern: '[\w.+-]+@[\w-]+\.[\w.]+'}
    validators:
      - {kind: one_of_inputs, field: recipient}
  - id: fetch
    kind: tool
    tool: read_email
    args_from: {index: intent.index}
  - id: summarize
    kind: agent
    owner: analyst
    instruction: Summarize the e-mail in at most three sentences.
    reads: [fetch.result]
    fields:
      summary: {type: string, role: data, max_length: 1200}
  - id: send
    kind: tool
    tool: send_email
    args_from: {to: intent.recipient, body: summarize.summary}
  - id: report
    kind: agent
    owner: reporter
    instruction: Tell the user what was done.
    reads: [task, send.result]
    fields:
      report: {type: string, role: data, max_length: 600}
release:
  outputs: [report]
