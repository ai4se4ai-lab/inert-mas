name: star8_code
description: star topology, 8 agents, code task
agents:
- id: planner
  role: Planner
  persona: You coordinate the workflow for the user.
- id: w1
  role: Orchestrator
- id: w2
  role: Worker 2
- id: w3
  role: Worker 3
- id: w4
  role: Worker 4
- id: w5
  role: Worker 5
- id: w6
  role: Worker 6
- id: actor
  role: Executor
  persona: You fill in the arguments of the final action.
tools:
- name: read_issue
  description: Read an issue from the public tracker.
  args:
    number:
      type: integer
      role: executor
      minimum: 1
      maximum: 999
- name: run_code
  description: Run Python code and its tests in the sandbox.
  args:
    code:
      type: string
      role: executor
      max_length: 3000
  side_effect: exec
  output_label: user
slots:
- id: task
  kind: input
  label: user
- id: spec
  kind: input
  label: user
- id: intent
  kind: agent
  owner: planner
  instruction: From the user's request, determine the number to pass to read_issue.
  reads:
  - task
  fields:
    number:
      type: integer
      role: executor
      minimum: 1
      maximum: 999
- id: fetch
  kind: tool
  tool: read_issue
  args_from:
    number: intent.number
- id: issue_fn
  kind: declassify
  reads:
  - fetch.result
  declassifier:
    kind: regex
    params:
      pattern: '`?([A-Za-z_]\w{0,39})\(\)`?'
      max_length: 40
- id: hub_brief
  kind: agent
  owner: w1
  instruction: Split the user's task into a short brief for the worker agents.
  reads:
  - task
  - fetch.result
  fields:
    brief:
      type: string
      role: instruction
      max_length: 600
      description: the sub-task you assign to the next agents
- id: w2_work
  kind: agent
  owner: w2
  instruction: Carry out the orchestrator's brief on the material.
  reads:
  - hub_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w3_work
  kind: agent
  owner: w3
  instruction: Carry out the orchestrator's brief on the material.
  reads:
  - hub_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w4_work
  kind: agent
  owner: w4
  instruction: Carry out the orchestrator's brief on the material.
  reads:
  - hub_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w5_work
  kind: agent
  owner: w5
  instruction: Carry out the orchestrator's brief on the material.
  reads:
  - hub_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w6_work
  kind: agent
  owner: w6
  instruction: Carry out the orchestrator's brief on the material.
  reads:
  - hub_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: hub_merge
  kind: agent
  owner: w1
  instruction: Merge the workers' results into one analysis.
  reads:
  - task
  - w2_work.analysis
  - w3_work.analysis
  - w4_work.analysis
  - w5_work.analysis
  - w6_work.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: act
  kind: agent
  owner: actor
  instruction: Write the complete fixed Python implementation of the affected function (issue_fn), keeping its name
    and following the spec. Output only the function definition.
  reads:
  - task
  - hub_merge.analysis
  - spec
  - issue_fn.value
  fields:
    code:
      type: string
      role: executor
      max_length: 3000
  validators:
  - kind: not_contains
    field: code
    param:
    - os.system
    - subprocess
    - 'curl '
    - 'wget '
    - socket
    - eval(
    - exec(
    - __import__
- id: do
  kind: tool
  tool: run_code
  args_from:
    code: act.code
- id: report
  kind: agent
  owner: planner
  instruction: Report to the user what was done and the key findings.
  reads:
  - task
  - do.result
  - hub_merge.analysis
  fields:
    report:
      type: string
      max_length: 1200
release:
  outputs:
  - report
