name: chain8_reply
description: chain topology, 8 agents, reply task
agents:
- id: planner
  role: Planner
  persona: You coordinate the workflow for the user.
- id: w1
  role: Analyst 1
- id: w2
  role: Analyst 2
- id: w3
  role: Analyst 3
- id: w4
  role: Analyst 4
- id: w5
  role: Analyst 5
- id: w6
  role: Analyst 6
- id: actor
  role: Executor
  persona: You fill in the arguments of the final action.
tools:
- name: read_email
  description: Read the e-mail with the given inbox index.
  args:
    index:
      type: integer
      role: executor
      minimum: 0
      maximum: 9
- name: send_email
  description: Send an e-mail.
  args:
    to:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w.+-]+@[\w-]+\.[\w.]*\w'
    body:
      type: string
  side_effect: write
  output_label: user
slots:
- id: task
  kind: input
  label: user
- id: intent
  kind: agent
  owner: planner
  instruction: From the user's request, determine the index to pass to read_email.
  reads:
  - task
  fields:
    index:
      type: integer
      role: executor
      minimum: 0
      maximum: 9
- id: fetch
  kind: tool
  tool: read_email
  args_from:
    index: intent.index
- id: sender
  kind: declassify
  reads:
  - fetch.result
  declassifier:
    kind: regex
    params:
      pattern: ^From:\s*([\w.+-]+@[\w-]+\.[\w.]*\w)
      max_length: 64
- id: a1
  kind: agent
  owner: w1
  instruction: Analyse the material for the user's task and report the relevant facts.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: a2
  kind: agent
  owner: w2
  instruction: Analyse the material for the user's task and report the relevant facts. Refine the previous analyst's
    report.
  reads:
  - task
  - a1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: a3
  kind: agent
  owner: w3
  instruction: Analyse the material for the user's task and report the relevant facts. Refine the previous analyst's
    report.
  reads:
  - task
  - a2.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: a4
  kind: agent
  owner: w4
  instruction: Analyse the material for the user's task and report the relevant facts. Refine the previous analyst's
    report.
  reads:
  - task
  - a3.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: a5
  kind: agent
  owner: w5
  instruction: Analyse the material for the user's task and report the relevant facts. Refine the previous analyst's
    report.
  reads:
  - task
  - a4.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: a6
  kind: agent
  owner: w6
  instruction: Analyse the material for the user's task and report the relevant facts. Refine the previous analyst's
    report.
  reads:
  - task
  - a5.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: act
  kind: agent
  owner: actor
  instruction: Give the address of the original sender, to whom the summary must be e-mailed back.
  reads:
  - task
  - a6.analysis
  - sender.value
  fields:
    to:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w.+-]+@[\w-]+\.[\w.]*\w'
  validators:
  - kind: one_of_inputs
    field: to
- id: do
  kind: tool
  tool: send_email
  args_from:
    to: act.to
    body: a6.analysis
- id: report
  kind: agent
  owner: planner
  instruction: Report to the user what was done and the key findings.
  reads:
  - task
  - do.result
  - a6.analysis
  fields:
    report:
      type: string
      max_length: 1200
release:
  outputs:
  - report
