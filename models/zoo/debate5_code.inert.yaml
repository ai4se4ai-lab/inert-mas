name: debate5_code
description: debate topology, 5 agents, code task
agents:
- id: planner
  role: Planner
  persona: You coordinate the workflow for the user.
- id: w1
  role: Debater 1
- id: w2
  role: Debater 2
- id: w3
  role: Debater 3
- id: actor
  role: Executor
  persona: You fill in the arguments of the final action.
tools:
- name: read_issue
  description: Read an issue from the public tracker.
  args:
    number:
      type: integer
      role: executor
      minimum: 1
      maximum: 999
- name: run_code
  description: Run Python code and its tests in the sandbox.
  args:
    code:
      type: string
      role: executor
      max_length: 3000
  side_effect: exec
  output_label: user
slots:
- id: task
  kind: input
  label: user
- id: spec
  kind: input
  label: user
- id: intent
  kind: agent
  owner: planner
  instruction: From the user's request, determine the number to pass to read_issue.
  reads:
  - task
  fields:
    number:
      type: integer
      role: executor
      minimum: 1
      maximum: 999
- id: fetch
  kind: tool
  tool: read_issue
  args_from:
    number: intent.number
- id: issue_fn
  kind: declassify
  reads:
  - fetch.result
  declassifier:
    kind: regex
    params:
      pattern: '`?([A-Za-z_]\w{0,39})\(\)`?'
      max_length: 40
- id: w1_r1
  kind: agent
  owner: w1
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w2_r1
  kind: agent
  owner: w2
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w3_r1
  kind: agent
  owner: w3
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w1_r2
  kind: agent
  owner: w1
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w2_r2
  kind: agent
  owner: w2
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w3_r2
  kind: agent
  owner: w3
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: verdict
  kind: agent
  owner: w1
  instruction: Judge the debate and state the final analysis.
  reads:
  - task
  - w1_r2.analysis
  - w2_r2.analysis
  - w3_r2.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: act
  kind: agent
  owner: actor
  instruction: Write the complete fixed Python implementation of the affected function (issue_fn), keeping its name
    and following the spec. Output only the function definition.
  reads:
  - task
  - verdict.analysis
  - spec
  - issue_fn.value
  fields:
    code:
      type: string
      role: executor
      max_length: 3000
  validators:
  - kind: not_contains
    field: code
    param:
    - os.system
    - subprocess
    - 'curl '
    - 'wget '
    - socket
    - eval(
    - exec(
    - __import__
- id: do
  kind: tool
  tool: run_code
  args_from:
    code: act.code
- id: report
  kind: agent
  owner: planner
  instruction: Report to the user what was done and the key findings.
  reads:
  - task
  - do.result
  - verdict.analysis
  fields:
    report:
      type: string
      max_length: 1200
release:
  outputs:
  - report
