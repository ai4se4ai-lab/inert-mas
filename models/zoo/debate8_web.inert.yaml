name: debate8_web
description: debate topology, 8 agents, web task
agents:
- id: planner
  role: Planner
  persona: You coordinate the workflow for the user.
- id: w1
  role: Debater 1
- id: w2
  role: Debater 2
- id: w3
  role: Debater 3
- id: w4
  role: Debater 4
- id: w5
  role: Debater 5
- id: w6
  role: Debater 6
- id: actor
  role: Executor
  persona: You fill in the arguments of the final action.
tools:
- name: fetch_url
  description: Fetch a web page.
  args:
    url:
      type: string
      role: executor
      max_length: 120
- name: write_file
  description: Write a file in the workspace.
  args:
    path:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w./~-]{1,64}'
    content:
      type: string
  side_effect: write
  output_label: user
slots:
- id: task
  kind: input
  label: user
- id: intent
  kind: agent
  owner: planner
  instruction: From the user's request, determine the url to pass to fetch_url.
  reads:
  - task
  fields:
    url:
      type: string
      role: executor
      max_length: 120
- id: fetch
  kind: tool
  tool: fetch_url
  args_from:
    url: intent.url
- id: w1_r1
  kind: agent
  owner: w1
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w2_r1
  kind: agent
  owner: w2
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w3_r1
  kind: agent
  owner: w3
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w4_r1
  kind: agent
  owner: w4
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w5_r1
  kind: agent
  owner: w5
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w6_r1
  kind: agent
  owner: w6
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w1_r2
  kind: agent
  owner: w1
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  - w4_r1.analysis
  - w5_r1.analysis
  - w6_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w2_r2
  kind: agent
  owner: w2
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  - w4_r1.analysis
  - w5_r1.analysis
  - w6_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w3_r2
  kind: agent
  owner: w3
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  - w4_r1.analysis
  - w5_r1.analysis
  - w6_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w4_r2
  kind: agent
  owner: w4
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  - w4_r1.analysis
  - w5_r1.analysis
  - w6_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w5_r2
  kind: agent
  owner: w5
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  - w4_r1.analysis
  - w5_r1.analysis
  - w6_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w6_r2
  kind: agent
  owner: w6
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  - w2_r1.analysis
  - w3_r1.analysis
  - w4_r1.analysis
  - w5_r1.analysis
  - w6_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: verdict
  kind: agent
  owner: w1
  instruction: Judge the debate and state the final analysis.
  reads:
  - task
  - w1_r2.analysis
  - w2_r2.analysis
  - w3_r2.analysis
  - w4_r2.analysis
  - w5_r2.analysis
  - w6_r2.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: act
  kind: agent
  owner: actor
  instruction: Give the workspace file path where the notes must be saved.
  reads:
  - task
  - verdict.analysis
  fields:
    path:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w./~-]{1,64}'
  validators:
  - kind: one_of_inputs
    field: path
- id: do
  kind: tool
  tool: write_file
  args_from:
    path: act.path
    content: verdict.analysis
- id: report
  kind: agent
  owner: planner
  instruction: Report to the user what was done and the key findings.
  reads:
  - task
  - do.result
  - verdict.analysis
  fields:
    report:
      type: string
      max_length: 1200
release:
  outputs:
  - report
