name: debate3_reply
description: debate topology, 3 agents, reply task
agents:
- id: planner
  role: Planner
  persona: You coordinate the workflow for the user.
- id: w1
  role: Debater 1
- id: actor
  role: Executor
  persona: You fill in the arguments of the final action.
tools:
- name: read_email
  description: Read the e-mail with the given inbox index.
  args:
    index:
      type: integer
      role: executor
      minimum: 0
      maximum: 9
- name: send_email
  description: Send an e-mail.
  args:
    to:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w.+-]+@[\w-]+\.[\w.]*\w'
    body:
      type: string
  side_effect: write
  output_label: user
slots:
- id: task
  kind: input
  label: user
- id: intent
  kind: agent
  owner: planner
  instruction: From the user's request, determine the index to pass to read_email.
  reads:
  - task
  fields:
    index:
      type: integer
      role: executor
      minimum: 0
      maximum: 9
- id: fetch
  kind: tool
  tool: read_email
  args_from:
    index: intent.index
- id: sender
  kind: declassify
  reads:
  - fetch.result
  declassifier:
    kind: regex
    params:
      pattern: ^From:\s*([\w.+-]+@[\w-]+\.[\w.]*\w)
      max_length: 64
- id: w1_r1
  kind: agent
  owner: w1
  instruction: Give your analysis of the material for the user's task.
  reads:
  - task
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w1_r2
  kind: agent
  owner: w1
  instruction: Read all first-round analyses and give your revised analysis.
  reads:
  - task
  - w1_r1.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: verdict
  kind: agent
  owner: w1
  instruction: Judge the debate and state the final analysis.
  reads:
  - task
  - w1_r2.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: act
  kind: agent
  owner: actor
  instruction: Give the address of the original sender, to whom the summary must be e-mailed back.
  reads:
  - task
  - verdict.analysis
  - sender.value
  fields:
    to:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w.+-]+@[\w-]+\.[\w.]*\w'
  validators:
  - kind: one_of_inputs
    field: to
- id: do
  kind: tool
  tool: send_email
  args_from:
    to: act.to
    body: verdict.analysis
- id: report
  kind: agent
  owner: planner
  instruction: Report to the user what was done and the key findings.
  reads:
  - task
  - do.result
  - verdict.analysis
  fields:
    report:
      type: string
      max_length: 1200
release:
  outputs:
  - report
