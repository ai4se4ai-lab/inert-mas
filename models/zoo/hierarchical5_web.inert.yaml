name: hierarchical5_web
description: hierarchical topology, 5 agents, web task
agents:
- id: planner
  role: Planner
  persona: You coordinate the workflow for the user.
- id: w1
  role: Manager
- id: w2
  role: Team lead 1
- id: w3
  role: Team lead 2
- id: actor
  role: Executor
  persona: You fill in the arguments of the final action.
tools:
- name: fetch_url
  description: Fetch a web page.
  args:
    url:
      type: string
      role: executor
      max_length: 120
- name: write_file
  description: Write a file in the workspace.
  args:
    path:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w./~-]{1,64}'
    content:
      type: string
  side_effect: write
  output_label: user
slots:
- id: task
  kind: input
  label: user
- id: intent
  kind: agent
  owner: planner
  instruction: From the user's request, determine the url to pass to fetch_url.
  reads:
  - task
  fields:
    url:
      type: string
      role: executor
      max_length: 120
- id: fetch
  kind: tool
  tool: fetch_url
  args_from:
    url: intent.url
- id: mgr_brief
  kind: agent
  owner: w1
  instruction: Write a brief for your team leads.
  reads:
  - task
  - fetch.result
  fields:
    brief:
      type: string
      role: instruction
      max_length: 600
      description: the sub-task you assign to the next agents
- id: w2_brief
  kind: agent
  owner: w2
  instruction: Refine the manager's brief for your engineers.
  reads:
  - mgr_brief.brief
  - fetch.result
  fields:
    brief:
      type: string
      role: instruction
      max_length: 600
      description: the sub-task you assign to the next agents
- id: w2_merge
  kind: agent
  owner: w2
  instruction: Merge your team's results.
  reads:
  - w2_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: w3_brief
  kind: agent
  owner: w3
  instruction: Refine the manager's brief for your engineers.
  reads:
  - mgr_brief.brief
  - fetch.result
  fields:
    brief:
      type: string
      role: instruction
      max_length: 600
      description: the sub-task you assign to the next agents
- id: w3_merge
  kind: agent
  owner: w3
  instruction: Merge your team's results.
  reads:
  - w3_brief.brief
  - fetch.result
  fields:
    analysis:
      type: string
      max_length: 1500
- id: mgr_merge
  kind: agent
  owner: w1
  instruction: Merge the team leads' results into one analysis.
  reads:
  - task
  - w2_merge.analysis
  - w3_merge.analysis
  fields:
    analysis:
      type: string
      max_length: 1500
- id: act
  kind: agent
  owner: actor
  instruction: Give the workspace file path where the notes must be saved.
  reads:
  - task
  - mgr_merge.analysis
  fields:
    path:
      type: string
      role: executor
      max_length: 64
      pattern: '[\w./~-]{1,64}'
  validators:
  - kind: one_of_inputs
    field: path
- id: do
  kind: tool
  tool: write_file
  args_from:
    path: act.path
    content: mgr_merge.analysis
- id: report
  kind: agent
  owner: planner
  instruction: Report to the user what was done and the key findings.
  reads:
  - task
  - do.result
  - mgr_merge.analysis
  fields:
    report:
      type: string
      max_length: 1200
release:
  outputs:
  - report
