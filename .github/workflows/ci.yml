name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: ruff check src baselines adapters/tamas/adapter.py tests
      - run: mypy
      - run: pytest
      - name: smoke grid (mock backend)
        run: inert run-manifest --manifest hpc/manifests/smoke.yaml --backend mock --out results/ci-smoke.jsonl --parallel 4
